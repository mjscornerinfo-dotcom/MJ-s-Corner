<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MJ's Corner — Sign In</title>
  <meta name="description" content="Sign in to MJ's Corner.">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta name="theme-color" content="#e63946">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  
  <script src="auth.js"></script>
  <script>
    (function() {
      const auth = window.MJAuth || (typeof MJAuth !== 'undefined' ? MJAuth : null);
      if (!auth) return;
      const user = auth.getCurrentUser();
      if (user) {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');
        if (redirect) {
          window.location.replace(redirect);
        } else if (auth.isAdmin(user)) {
          window.location.replace('admin.html');
        } else {
          window.location.replace('index.html');
        }
      }
    })();
  </script>

  <!-- Official Phone.Email Script -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body class="auth-page">
  <!-- ========== HEADER ========== -->
  <header class="header" id="header">
    <div class="header-inner">
      <a href="index.html" class="logo" style="text-decoration:none;">
        <div class="logo-icon">
          <img src="LOGO.jpg" alt="MJ's Corner Logo">
        </div>
        MJ's Corner
      </a>
      <div class="header-actions">
        <a href="index.html" class="btn-ghost-nav">🍽️ View Menu</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </header>

  <!-- ========== AUTH MAIN ========== -->
  <main class="auth-main">
    <div class="auth-container">

      <!-- Main Unified Auth Card -->
      <div class="auth-card">
        <div class="auth-panel active" style="padding: 36px 30px;">
          
          <div class="auth-header" style="margin-bottom: 28px;">
            <h1 style="margin: 0 0 8px 0;">Sign In</h1>
            <p style="margin: 0; color: var(--text-secondary); font-size: 0.92rem;">Choose your preferred sign-in method to continue</p>
          </div>

          <div class="pe-auth-container">
            <!-- Option 1: Mobile Number OTP -->
            <div class="pe-auth-section">
              <div class="pe-section-header">
                <span class="pe-section-icon">📱</span>
                <div>
                  <div class="pe-section-title">Sign in with Mobile Number</div>
                  <div class="pe-section-subtitle">Instant SMS OTP verification</div>
                </div>
              </div>
              <div class="pe-button-wrapper">
                <div class="pe_signin_button" data-client-id="11976801478974448261">
                  <script src="https://www.phone.email/sign_in_button_v1.js" async></script>
                </div>
              </div>
            </div>

            <!-- Divider -->
            <div class="auth-divider">
              <span class="auth-divider-line"></span>
              <span class="auth-divider-text">OR</span>
              <span class="auth-divider-line"></span>
            </div>

            <!-- Option 2: Email OTP -->
            <div class="pe-auth-section">
              <div class="pe-section-header">
                <span class="pe-section-icon">✉️</span>
                <div>
                  <div class="pe-section-title">Sign in with Email</div>
                  <div class="pe-section-subtitle">Instant Email OTP verification</div>
                </div>
              </div>
              <div class="pe-button-wrapper">
                <div class="pe_verify_email" data-client-id="11976801478974448261">
                  <script src="https://www.phone.email/verify_email_v1.js" async></script>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- ========== TOAST CONTAINER ========== -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="login.js"></script>
</body>
</html>
